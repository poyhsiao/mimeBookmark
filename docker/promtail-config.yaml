server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: mimebookmark-logs
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /app/logs/**/*.log
          job: mimebookmark-logs
          app: mimebookmark
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
      - labels:
          level:
          service:

  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/**/*.log
          job: system-logs
    relabel_configs:
      - source_labels: [__path__]
        regex: /var/log/nginx/.*
        action: drop
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+) (?P<hostname>\S+) (?P<process>\S+): (?P<message>.*)$'
      - labels:
          hostname:
          process:

  - job_name: nginx-logs
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/nginx/**/*.log
          job: nginx-logs
          app: nginx
    pipeline_stages:
      - regex:
          expression: '^(?P<client_ip>\S+) - (?P<remote_user>\S+) \[(?P<timestamp>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<body_bytes>\d+) "(?P<referer>[^"]*)" "(?P<user_agent>[^"]*)"'
      - labels:
          status: