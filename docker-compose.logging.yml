version: "3.8"

services:
  loki:
    image: grafana/loki:3.4.6
    container_name: mimebookmark-loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/var/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - mimebookmark-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.6
    container_name: mimebookmark-promtail
    volumes:
      - ./docker/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/log:/var/log:ro
      - ./src/logs:/app/logs:ro
      - promtail-data:/tmp
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - mimebookmark-network
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.0
    container_name: mimebookmark-grafana
    ports:
      - "3001:3000"
    # WARNING: In production, you MUST set secure credentials via:
    # - Docker secrets (recommended): Create secret files and reference them below
    # - Environment variables: Set GF_SECURITY_ADMIN_USER and GF_SECURITY_ADMIN_PASSWORD
    # Never use weak defaults in production environments.
    # Exposing Grafana without proper authentication is a security risk.
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD?GF_SECURITY_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - mimebookmark-network
    depends_on:
      - loki
    restart: unless-stopped

networks:
  mimebookmark-network:
    driver: bridge

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local
  promtail-data:
    driver: local
